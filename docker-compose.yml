services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiands-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-XIANDS}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-xiands}
      DB_USERNAME: ${DB_USERNAME:-xiands}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_COMPROBANTES: ${FILESYSTEM_COMPROBANTES:-public}
      B2_ACCESS_KEY_ID: ${B2_ACCESS_KEY_ID}
      B2_SECRET_ACCESS_KEY: ${B2_SECRET_ACCESS_KEY}
      B2_DEFAULT_REGION: ${B2_DEFAULT_REGION}
      B2_BUCKET: ${B2_BUCKET}
      B2_ENDPOINT: ${B2_ENDPOINT}
      B2_URL: ${B2_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@xiands.com}
      ADMIN_NAME: ${ADMIN_NAME:-Administradora}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    expose:
      - "80"
    networks:
      - xiands

  db:
    image: mysql:8.4
    container_name: xiands-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-xiands}
      MYSQL_USER: ${DB_USERNAME:-xiands}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xiands

networks:
  xiands:
    driver: bridge

volumes:
  mysql_data:
